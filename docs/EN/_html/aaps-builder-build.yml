# AAPS Builder build workflow, version 4
#
# Builds AAPS from the official source (github.com/nightscout/AndroidAPS), signed with your key
# (secret KEYSTORE_SET). The build steps are in the AAPS documentation repository, file
# .github/workflows/aaps-builder.yml, pinned below to one reviewed commit: they never change
# unless you replace this file with a newer version from the AAPS Builder setup page.
# Docs: https://androidaps.readthedocs.io/en/latest/SettingUpAaps/BrowserBuildAapsBuilder.html
#
# A build runs only when you start it (Actions -> Build AAPS -> Run workflow).

name: Build AAPS
run-name: ${{ format('Build AAPS {0} ({1})', inputs.version, inputs.variant) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'AAPS version ("latest" = newest release)'
        required: true
        default: 'latest'
        type: string
      variant:
        description: 'Build variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - aapsclientRelease
          - aapsclient2Release
          - aapsclient3Release
          - pumpcontrolRelease
          - fullDebug

permissions:
  contents: read

jobs:
  aaps:
    name: AAPS
    uses: openaps/AndroidAPSdocs/.github/workflows/aaps-builder.yml@bc9f347a1fa13a5b514a6a9e742e615f2b716844
    with:
      version: ${{ inputs.version }}
      variant: ${{ inputs.variant }}
    secrets:
      KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
      GDRIVE_OAUTH2: ${{ secrets.GDRIVE_OAUTH2 }}
