# AAPS Builder build workflow, version 1
#
# Builds the AAPS app from the official AndroidAPS source (github.com/nightscout/AndroidAPS) in your
# own private repository, signed with your own key (secret KEYSTORE_SET).
#
# Source: AAPS documentation, https://androidaps.readthedocs.io/en/latest/SettingUpAaps/BrowserBuildAapsBuilder.html
# The only code this file downloads is the AAPS source from nightscout/AndroidAPS and GitHub's own
# actions (actions/setup-java, actions/upload-artifact). To update it, replace this file with the
# newest version from the AAPS Builder setup page (step "Add the build workflow").
#
# Based on AAPS Builder by the AAPS Builder authors (github.com/dio99/aaps-builder), AGPL-3.0.
# Modified for the AAPS documentation: see aaps-builder/README.md in github.com/openaps/AndroidAPSdocs.
#
# Once a week (Monday night) it checks whether a new AAPS version was released and builds it.
# To turn that off: Settings -> Secrets and variables -> Actions -> Variables ->
# New repository variable: AUTO_BUILD = false
# To auto-build another variant than fullRelease, add a variable AUTO_VARIANT (e.g. aapsclientRelease).

name: Build AAPS
run-name: ${{ github.event_name == 'schedule' && 'Weekly check for a new AAPS version' || format('Build AAPS {0} ({1})', inputs.version, inputs.variant) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'AAPS version ("latest" = newest release)'
        required: true
        default: 'latest'
        type: string
      variant:
        description: 'Build variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - aapsclientRelease
          - aapsclient2Release
          - pumpcontrolRelease
          - fullDebug
  schedule:
    - cron: '23 3 * * 1'   # Mondays 03:23 UTC

permissions:
  contents: read

env:
  DOCS_PAGE: https://androidaps.readthedocs.io/en/latest/SettingUpAaps/BrowserBuildAapsBuilder.html
  IN_VERSION: ${{ inputs.version || 'latest' }}
  IN_VARIANT: ${{ inputs.variant || vars.AUTO_VARIANT || 'fullRelease' }}
  AUTO: ${{ github.event_name == 'schedule' }}

jobs:
  check:
    name: Check
    if: ${{ github.event_name != 'schedule' || vars.AUTO_BUILD != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      private: ${{ steps.check.outputs.private }}
    env:
      UPSTREAM: https://github.com/nightscout/AndroidAPS.git
      HAS_GDRIVE: ${{ secrets.GDRIVE_OAUTH2 != '' }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_SET != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check repository, version and keystore
        id: check
        run: |
          # On a scheduled run, problems are not errors: just skip quietly.
          stop() {
            if [ "$AUTO" = true ]; then echo "ℹ️ $1 Skipping."; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::error::$1"; exit 1
          }
          api() { curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -w '\n%{http_code}' "https://api.github.com/repos/$GITHUB_REPOSITORY$1"; }

          REPO_JSON=$(api "" | head -n -1)
          PRIVATE=$(echo "$REPO_JSON" | jq -r .private)
          echo "private=$PRIVATE" >> "$GITHUB_OUTPUT"
          if [ "$PRIVATE" != true ] && [ "$HAS_GDRIVE" != true ]; then
            stop "This repository is PUBLIC, anyone could download your APK. Make it private: Settings -> General -> Danger Zone -> Change visibility -> Private"
          fi
          [ "$HAS_KEYSTORE" = true ] || stop "Secret KEYSTORE_SET is missing. Create it with the AAPS Builder setup page ($DOCS_PAGE) and add it under Settings -> Secrets and variables -> Actions."

          VERSION="$IN_VERSION"
          VERSION="${VERSION// /}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            VERSION=$(git ls-remote --tags --refs "$UPSTREAM" \
              | awk -F/ '{print $3}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -V | tail -1)
          fi
          git ls-remote --exit-code --tags "$UPSTREAM" "refs/tags/$VERSION" > /dev/null \
            || stop "Version $VERSION does not exist in nightscout/AndroidAPS."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$AUTO" = true ]; then
            CODE=$(api "/git/ref/tags/built/$VERSION-$IN_VARIANT" | tail -1)
            if [ "$CODE" = 200 ]; then
              echo "✅ AAPS $VERSION ($IN_VARIANT) is already built. Nothing to do."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "🆕 New AAPS version $VERSION found, building."
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build AAPS ${{ needs.check.outputs.version }}
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write   # to remember which version was built (tag built/<version>-<variant>)
    env:
      UPSTREAM: https://github.com/nightscout/AndroidAPS.git
      HAS_GDRIVE: ${{ secrets.GDRIVE_OAUTH2 != '' }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Read keystore
        env:
          KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
        run: |
          DECODED=$(printf '%s' "$KEYSTORE_SET" | tr -d ' \r\n' | base64 -d) || { echo "::error::KEYSTORE_SET is not valid. Copy it again from the setup page."; exit 1; }
          KEYSTORE_BASE64=$(printf '%s' "$DECODED" | cut -d'|' -f1)
          KEYSTORE_PASSWORD=$(printf '%s' "$DECODED" | cut -d'|' -f2)
          KEY_ALIAS=$(printf '%s' "$DECODED" | cut -d'|' -f3)
          KEY_PASSWORD=$(printf '%s' "$DECODED" | cut -d'|' -f4)
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"
          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate keystore and passwords
        run: |
          echo test > dummy.txt && zip -q dummy.jar dummy.txt
          if ! jarsigner -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              dummy.jar "$KEY_ALIAS" > jarsigner.log 2>&1; then
            echo "::error::Keystore, password or alias is wrong. Create KEYSTORE_SET again with the setup page."
            cat jarsigner.log
            exit 1
          fi
          rm -f dummy.txt dummy.jar jarsigner.log
          echo "✅ Keystore OK"

      - name: Prepare build settings
        run: |
          case "$VERSION" in
            2.*|3.0.*) JAVA_VERSION=11 ;;
            3.1.*|3.2.*) JAVA_VERSION=17 ;;
            *) JAVA_VERSION=21 ;;
          esac
          VARIANT="$IN_VARIANT"
          FLAVOR=$(echo "$VARIANT" | sed -E 's/(Release|Debug)$//')
          TYPE=$(echo "$VARIANT" | grep -oE '(Release|Debug)$' | tr '[:upper:]' '[:lower:]')
          SUFFIX=""
          [ "$FLAVOR" != "full" ] && SUFFIX="-$FLAVOR"
          [ "$TYPE" = "debug" ] && SUFFIX="$SUFFIX-debug"
          {
            echo "JAVA_VERSION=$JAVA_VERSION"
            echo "VARIANT=$VARIANT"
            echo "FLAVOR=$FLAVOR"
            echo "TYPE=$TYPE"
            echo "SUFFIX=$SUFFIX"
          } >> "$GITHUB_ENV"
          echo "### Building AAPS $VERSION ($VARIANT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Download AAPS source
        run: git clone --depth 1 --branch "$VERSION" "$UPSTREAM" aaps

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            aaps/**/*.gradle*
            aaps/**/gradle-wrapper.properties

      # Private repositories get a small runner (2 CPU, ~7 GB RAM). Without extra swap
      # the machine runs out of memory when R8 optimizes the app and the job is killed.
      - name: Add swap
        run: |
          DIR=/mnt; [ -w "$DIR" ] || sudo test -d "$DIR" || DIR=/
          FREE_GB=$(df -BG --output=avail "$DIR" | tail -1 | tr -dc 0-9)
          SIZE=$(( FREE_GB > 24 ? 12 : 6 ))
          sudo fallocate -l ${SIZE}G "$DIR/aaps.swap"
          sudo chmod 600 "$DIR/aaps.swap"
          sudo mkswap "$DIR/aaps.swap" > /dev/null
          sudo swapon "$DIR/aaps.swap"
          free -h

      - name: Build APKs
        working-directory: aaps
        run: |
          chmod +x gradlew
          ./gradlew ":app:assemble$VARIANT" ":wear:assemble$VARIANT" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Xss1024m" \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.workers.max=2 \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect APKs
        run: |
          mkdir out
          mv aaps/app/build/outputs/apk/"$FLAVOR"/"$TYPE"/*.apk "out/aaps-$VERSION$SUFFIX.apk"
          mv aaps/wear/build/outputs/apk/"$FLAVOR"/"$TYPE"/*.apk "out/aaps-wear-$VERSION$SUFFIX.apk"
          rm -rf "$RUNNER_TEMP/keystore"
          ls -l out

      # Without Google Drive the check job only lets private repositories get this far.
      # archive: false uploads the APK itself (no zip), so the phone can install it directly.
      - name: Upload phone APK (download it from this page)
        id: phone
        if: ${{ needs.check.outputs.private == 'true' || env.HAS_GDRIVE != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          path: out/aaps-${{ env.VERSION }}${{ env.SUFFIX }}.apk
          archive: false
          retention-days: 14

      - name: Upload watch APK
        id: wear
        if: ${{ needs.check.outputs.private == 'true' || env.HAS_GDRIVE != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          path: out/aaps-wear-${{ env.VERSION }}${{ env.SUFFIX }}.apk
          archive: false
          retention-days: 14

      - name: Show download links
        if: ${{ steps.phone.outputs.artifact-url != '' }}
        env:
          PHONE_URL: ${{ steps.phone.outputs.artifact-url }}
          WEAR_URL: ${{ steps.wear.outputs.artifact-url }}
        run: |
          {
            echo "> [!WARNING]"
            echo "> **Before you install: back up your settings!**"
            echo "> 1. AAPS → Maintenance → **Export settings**"
            echo "> 2. Copy the exported file **off the phone** (Google Drive, Dropbox…)"
            echo ">"
            echo "> [How to export settings](https://androidaps.readthedocs.io/en/latest/Maintenance/ExportImportSettings.html) · [AAPS FAQ: backups](https://androidaps.readthedocs.io/en/latest/UsefulLinks/FAQ.html#how-to-organize-my-backups)"
            echo
            echo "## 📱 [Download AAPS $VERSION]($PHONE_URL)"
            echo "Open this page on your phone, tap the link, then tap the downloaded file to install."
            echo
            echo "⌚ [Watch: aaps-wear-$VERSION$SUFFIX.apk]($WEAR_URL) (only for a smartwatch)"
            echo
            echo "_Available for 14 days._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs to Google Drive
        if: ${{ env.HAS_GDRIVE == 'true' }}
        env:
          GDRIVE_OAUTH2: ${{ secrets.GDRIVE_OAUTH2 }}
        run: |
          set -e
          DECODED=$(printf '%s' "$GDRIVE_OAUTH2" | base64 -d)
          CLIENT_ID=$(printf '%s' "$DECODED" | cut -d'|' -f1)
          REFRESH_TOKEN=$(printf '%s' "$DECODED" | cut -d'|' -f2)
          echo "::add-mask::$CLIENT_ID"
          echo "::add-mask::$REFRESH_TOKEN"
          TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r .access_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Google Drive access has expired or was revoked (unused for 6 months or Google password changed). Redo the Google Drive step of the setup page and update the GDRIVE_OAUTH2 secret."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          API=https://www.googleapis.com/drive/v3/files

          folder() { # name parent -> id (created if missing)
            local q="name='$1' and mimeType='application/vnd.google-apps.folder' and trashed=false"
            [ -n "$2" ] && q="$q and '$2' in parents"
            local id=$(curl -s -G -H "Authorization: Bearer $TOKEN" "$API" --data-urlencode "q=$q" | jq -r '.files[0].id')
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              local body=$(jq -nc --arg n "$1" --arg p "$2" '{name:$n, mimeType:"application/vnd.google-apps.folder"} + (if $p=="" then {} else {parents:[$p]} end)')
              id=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$body" "$API" | jq -r .id)
            fi
            echo "$id"
          }

          AAPS_ID=$(folder AAPS "")
          VERSION_ID=$(folder "$VERSION" "$AAPS_ID")
          for f in out/*.apk; do
            NAME=$(basename "$f")
            OLD=$(curl -s -G -H "Authorization: Bearer $TOKEN" "$API" \
              --data-urlencode "q=name='$NAME' and '$VERSION_ID' in parents and trashed=false" | jq -r '.files[0].id')
            [ -n "$OLD" ] && [ "$OLD" != "null" ] && curl -s -X DELETE -H "Authorization: Bearer $TOKEN" "$API/$OLD"
            CODE=$(curl -s -o resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" \
              -F "metadata={\"name\":\"$NAME\",\"parents\":[\"$VERSION_ID\"]};type=application/json;charset=UTF-8" \
              -F "file=@$f;type=application/vnd.android.package-archive" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart")
            if [ "$CODE" != 200 ] && [ "$CODE" != 201 ]; then
              echo "::error::Upload of $NAME failed ($CODE)"; cat resp.json; exit 1
            fi
            echo "✅ $NAME → Google Drive: AAPS/$VERSION"
          done
          echo "📁 APKs uploaded to Google Drive folder **AAPS/$VERSION**" >> "$GITHUB_STEP_SUMMARY"

      - name: Remember that this version is built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="built/$VERSION-$VARIANT"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
            -d "{\"ref\":\"refs/tags/$TAG\",\"sha\":\"$GITHUB_SHA\"}")
          case "$CODE" in
            201) echo "🏷️ Marked $TAG" ;;
            422) echo "🏷️ $TAG already marked" ;;
            *) echo "::warning::Could not mark $TAG ($CODE). The weekly check may build this version again." ;;
          esac
