<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAPS Builder</title>
<meta name="description" content="Build your own AAPS app in GitHub, without installing anything.">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<!--
  AAPS Builder setup page. Creates the KEYSTORE_SET secret for a private GitHub
  repository made from the aaps-builder template, which builds AAPS with
  GitHub Actions.

  Copyright (C) the AAPS Builder authors, https://github.com/dio99/aaps-builder
  Licensed under the GNU Affero General Public License v3.0 (AGPL-3.0).

  MODIFIED COPY of index.html at upstream commit 1115eea6c10a28b91486ccdee85a37e26ef75f41. Changes, made by
  aaps-builder/sync.py in https://github.com/openaps/AndroidAPSdocs:
  forge is served locally, the inline script moved to aaps-builder.app.js,
  this Content-Security-Policy and notice added, and the links to the AAPS
  documentation made relative. Full list: aaps-builder/README.md.

  This page makes NO network requests (enforced by the Content-Security-Policy
  above): the keystore and passwords never leave this browser.

  Application logic: aaps-builder.app.js (readable, unminified).
  Vendor library:    aaps-builder.forge.min.js = node-forge 1.3.1 (BSD-3-Clause
                     or GPL-2.0), https://github.com/digitalbazaar/forge
-->
<script src="aaps-builder.forge.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6470; --line: #dfe3e8;
    --accent: #1f6feb; --accent-text: #ffffff; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --soft: #eef3fb; --code: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --text: #e6e9ed; --muted: #9aa4b0; --line: #2a3038;
      --accent: #4c8dff; --accent-text: #0b0d10; --ok: #3fb950; --warn: #d29922; --err: #f85149;
      --soft: #1a2333; --code: #20252c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --card: #171b21; --text: #e6e9ed; --muted: #9aa4b0; --line: #2a3038;
    --accent: #4c8dff; --accent-text: #0b0d10; --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --soft: #1a2333; --code: #20252c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font-size: 1.6rem; margin: 0; }
  .lead { color: var(--muted); margin: 6px 0 24px; }
  .lang button { background: none; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .lang button.on { color: var(--text); border-color: var(--text); }
  section.step {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  section.step.done { border-color: var(--ok); }
  .step h2 { font-size: 1.15rem; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; }
  .num {
    flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    display: inline-flex; align-items: center; justify-content: center; font-size: .9rem; font-weight: 700;
  }
  .done .num { background: var(--ok); }
  p { margin: 8px 0; }
  .muted { color: var(--muted); font-size: .92rem; }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 10px 12px; font: inherit; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input[type=file] { font: inherit; max-width: 100%; }
  select { width: 100%; padding: 10px 12px; font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .btn {
    display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; text-decoration: none;
  }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .tabs { display: flex; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
  .tabs button {
    flex: 1 1 200px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font: inherit; cursor: pointer; text-align: left;
  }
  .tabs button.on { border-color: var(--accent); background: var(--soft); }
  .tabs b { display: block; }
  .msg { margin-top: 10px; font-size: .95rem; }
  .warnbox { border-left: 4px solid var(--warn); background: var(--soft); border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
  .warnbox ol { margin: 6px 0 0; padding-left: 20px; }
  .warnbox a { color: var(--accent); }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); } .msg.warn { color: var(--warn); }
  .box { background: var(--soft); border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
  .secret-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  code { background: var(--code); padding: 2px 6px; border-radius: 4px; font-size: .92em; word-break: break-all; }
  ol.small { padding-left: 20px; margin: 8px 0; }
  ol.small li { margin: 4px 0; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin-top: 10px; }
  [hidden] { display: none !important; }
  footer { color: var(--muted); font-size: .85rem; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AAPS Builder</h1>
    <div class="lang"><button data-lang="en">EN</button> <button data-lang="sv">SV</button></div>
  </header>
  <p class="lead" data-i18n="lead"></p>

  <!-- Step 1: GitHub account + private repo -->
  <section class="step" id="s1">
    <h2><span class="num">1</span><span data-i18n="s1.title"></span></h2>
    <p data-i18n="s1.text"></p>
    <label for="user" data-i18n="s1.user"></label>
    <input type="text" id="user" autocomplete="username" spellcheck="false" placeholder="my-github-name">
    <p class="muted" data-i18n="s1.noaccount"></p>
    <label for="repo" data-i18n="s1.repo"></label>
    <input type="text" id="repo" spellcheck="false" placeholder="my-aaps">
    <p class="muted" data-i18n="s1.repoHint"></p>
    <div class="box"><span data-i18n="yourRepo"></span> <code class="repoUrl"></code></div>
    <a class="btn" id="createRepo" target="_blank" rel="noopener" data-i18n="s1.button"></a>
    <p data-i18n="s1.onGithub"></p>
    <ol class="small">
      <li data-i18n="s1.gh3"></li>
    </ol>
    <p class="muted"><span data-i18n="s1.gh1"></span> <code class="repoName"></code>, <span data-i18n="s1.gh2"></span></p>
  </section>

  <!-- Step 2: keystore -->
  <section class="step" id="s2">
    <h2><span class="num">2</span><span data-i18n="s2.title"></span></h2>
    <p data-i18n="s2.text"></p>
    <div class="tabs">
      <button id="tabHave"><b data-i18n="s2.have"></b><span class="muted" data-i18n="s2.haveSub"></span></button>
      <button id="tabNew"><b data-i18n="s2.new"></b><span class="muted" data-i18n="s2.newSub"></span></button>
    </div>

    <div id="paneHave" hidden>
      <label for="ksFile" data-i18n="have.file"></label>
      <input type="file" id="ksFile" accept=".jks,.keystore,.p12,.pfx,application/octet-stream">
      <label for="ksPass" data-i18n="have.pass"></label>
      <input type="password" id="ksPass" autocomplete="off">
      <label for="ksAlias" data-i18n="have.alias"></label>
      <select id="ksAliasSel" hidden></select>
      <input type="text" id="ksAlias" autocomplete="off" spellcheck="false" placeholder="key0">
      <label class="check"><input type="checkbox" id="samePass" checked> <span data-i18n="have.same"></span></label>
      <div id="keyPassWrap" hidden>
        <label for="keyPass" data-i18n="have.keypass"></label>
        <input type="password" id="keyPass" autocomplete="off">
      </div>
      <button class="btn" id="haveGo" data-i18n="have.button"></button>
      <div class="msg" id="haveMsg"></div>
    </div>

    <div id="paneNew" hidden>
      <p data-i18n="new.text"></p>
      <label for="newPass" data-i18n="new.pass"></label>
      <input type="password" id="newPass" autocomplete="new-password">
      <label for="newPass2" data-i18n="new.pass2"></label>
      <input type="password" id="newPass2" autocomplete="new-password">
      <button class="btn" id="newGo" data-i18n="new.button"></button>
      <div class="msg" id="newMsg"></div>
      <div class="box" id="backupBox" hidden>
        <p><b data-i18n="new.backupTitle"></b></p>
        <p data-i18n="new.backupText"></p>
        <button class="btn" id="downloadKs" data-i18n="new.download"></button>
      </div>
    </div>
  </section>

  <!-- Step 3: secret -->
  <section class="step" id="s3">
    <h2><span class="num">3</span><span data-i18n="s3.title"></span></h2>
    <p id="s3wait" class="muted" data-i18n="s3.wait"></p>
    <div id="s3ready" hidden>
      <ol class="small">
        <li><a class="btn secondary" id="openSecrets" target="_blank" rel="noopener" data-i18n="s3.open"></a>
          <p class="muted"><span data-i18n="opens"></span> <code class="repoUrl"></code></p>
          <p class="muted" data-i18n="notFound"></p></li>
        <li><span data-i18n="s3.name"></span>
          <div class="secret-row"><code>KEYSTORE_SET</code> <button class="btn secondary" style="margin:0" data-copy="name" data-i18n="copy"></button></div></li>
        <li><span data-i18n="s3.value"></span>
          <div class="secret-row"><button class="btn" style="margin:0" data-copy="secret" data-i18n="s3.copyValue"></button></div></li>
        <li data-i18n="s3.save"></li>
      </ol>
      <div class="msg" id="copyMsg"></div>
    </div>
  </section>

  <!-- Step 4: build -->
  <section class="step" id="s4">
    <h2><span class="num">4</span><span data-i18n="s4.title"></span></h2>
    <ol class="small">
      <li><a class="btn" id="openActions" target="_blank" rel="noopener" data-i18n="s4.open"></a>
        <p class="muted"><span data-i18n="opens"></span> <code class="repoUrl"></code></p></li>
      <li data-i18n="s4.enable"></li>
      <li data-i18n="s4.run"></li>
      <li data-i18n="s4.wait"></li>
    </ol>
    <div class="warnbox">
      <b data-i18n="s4.trouble"></b>
      <ol>
        <li data-i18n="s4.t1"></li>
        <li data-i18n="s4.t2"></li>
        <li data-i18n="s4.t3"></li>
      </ol>
    </div>
  </section>

  <!-- Step 5: install -->
  <section class="step" id="s5">
    <h2><span class="num">5</span><span data-i18n="s5.title"></span></h2>
    <div class="warnbox">
      <b data-i18n="bk.title"></b>
      <ol>
        <li data-i18n="bk.1"></li>
        <li data-i18n="bk.2"></li>
        <li data-i18n="bk.3"></li>
      </ol>
      <p class="muted" style="margin-bottom:0"><a href="Maintenance/ExportImportSettings.html" target="_blank" rel="noopener" data-i18n="bk.howto"></a> · <a href="UsefulLinks/FAQ.html#how-to-organize-my-backups" target="_blank" rel="noopener" data-i18n="bk.faq"></a></p>
    </div>
    <ol class="small">
      <li data-i18n="s5.1"></li>
      <li><a class="btn secondary" id="openRuns" target="_blank" rel="noopener" data-i18n="s5.open"></a></li>
      <li data-i18n="s5.2"></li>
      <li data-i18n="s5.3"></li>
      <li data-i18n="s5.4"></li>
      <li data-i18n="s5.5"></li>
    </ol>
    <p class="muted" data-i18n="s5.note"></p>
    <p class="muted" data-i18n="s5.update"></p>
  </section>

  <!-- Step 6: optional Google Drive -->
  <section class="step" id="s6">
    <h2><span class="num">6</span><span data-i18n="s6.title"></span></h2>
    <p data-i18n="s6.text"></p>
    <ol class="small">
      <li><span data-i18n="s6.get"></span>
        <br><a class="btn secondary" href="SettingUpAaps/BrowserBuildAapsBuilder.html#aaps-builder-google-drive" target="_blank" rel="noopener" data-i18n="s6.guide"></a></li>
      <li><a class="btn secondary" id="openSecrets2" target="_blank" rel="noopener" data-i18n="s3.open"></a>
        <p class="muted"><span data-i18n="opens"></span> <code class="repoUrl"></code></p></li>
      <li><span data-i18n="s3.name"></span>
        <div class="secret-row"><code>GDRIVE_OAUTH2</code> <button class="btn secondary" style="margin:0" data-copy="gdrive" data-i18n="copy"></button></div></li>
      <li data-i18n="s6.paste"></li>
    </ol>
    <p data-i18n="s6.result"></p>
    <p class="muted" data-i18n="s6.expire"></p>
  </section>

  <footer data-i18n="footer"></footer>
</main>

<script src="aaps-builder.app.js"></script>
</body>
</html>
